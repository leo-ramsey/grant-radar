.grain { position: absolute; inset: -50px; pointer-events: none; opacity: .07; mix-blend-mode: overlay; z-index: 50; }
/* phone mockup */
#phoneWrap { position: absolute; left: 0; right: 0; top: 0; bottom: 0; perspective: 2400px; pointer-events: none; }
#phone { position: absolute; left: 50%; top: 600px; width: 664px; height: 1386px; margin-left: -332px; border-radius: 76px; background: linear-gradient(160deg, #1B2246, #05070F 40%, #0B1030); padding: 22px; box-sizing: border-box;
  box-shadow: 0 50px 140px rgba(0,0,0,.65), inset 0 0 0 2px #333B68, 0 0 120px rgba(120,140,255,.22); transform-style: preserve-3d; }

#flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 60; pointer-events: none; }
.over { position: absolute; left: 70px; right: 70px; z-index: 5; }
.over .l1 { font-family: Unb; font-weight: 800; font-size: 92px; line-height: 1.02; letter-spacing: -.035em; }
.over .l2 { font-family: Unb; font-weight: 800; font-size: 92px; line-height: 1.02; letter-spacing: -.035em; color: #FFC56B; }

/* ---------- helpers ---------- */
function cl(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function pr(t, a, b) { return cl((t - a) / (b - a)); }
function eo(x) { return 1 - Math.pow(1 - x, 3); }            // ease out cubic
function eox(x) { return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); } // ease out expo
function eio(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function back(x) { var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
function el(tag, cls, html, parent, css) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (css) e.style.cssText = css; (parent || cam).appendChild(e); return e; }
function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
// word that slams in: scale 1.6 -> 1, blur -> 0
