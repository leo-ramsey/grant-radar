  :root:not([data-theme="light"]) {
    --bg: #0B1020; --surface: #141B2E; --surface-2: #19213A; --ink: #E6EAF3; --muted: #A9B2C7; --line: #27314B;
    --accent: #8A9BFF; --accent-ink: #0B1020; --accent-soft: #1E2750;
    --open: #63D59F; --open-soft: #11301F; --soon: #F2B45A; --soon-soft: #36270F; --later: #A3ACBF; --later-soft: #1F2739;
    --shadow: rgba(0, 0, 0, .45);
    --mark-bg: #212B52; --mark-ring: rgba(255, 255, 255, .15); --mark-accent: #93A3FF; --mark-blip: #F3F5FF;
    --flag-bg-op: .3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1020; --surface: #141B2E; --surface-2: #19213A; --ink: #E6EAF3; --muted: #A9B2C7; --line: #27314B;
  --accent: #8A9BFF; --accent-ink: #0B1020; --accent-soft: #1E2750;
  --open: #63D59F; --open-soft: #11301F; --soon: #F2B45A; --soon-soft: #36270F; --later: #A3ACBF; --later-soft: #1F2739;
  --shadow: rgba(0, 0, 0, .45);
  --mark-bg: #212B52; --mark-ring: rgba(255, 255, 255, .15); --mark-accent: #93A3FF; --mark-blip: #F3F5FF;
  --flag-bg-op: .3;
  color-scheme: dark;
}
html.top-dark { --band: var(--night); }
/* world "night": the whole home page lives on the dark screen palette; the catalogue keeps the light theme */
html[data-world="night"][data-view="home"] {
  --bg: #070B18; --surface: #0D1430; --surface-2: #121A3C; --ink: #EEF1FF; --muted: #A9B3CC; --line: rgba(143, 162, 255, .17);
  --accent: #8FA2FF; --accent-ink: #070B18; --accent-soft: rgba(143, 162, 255, .14);
  --open: #5BE0A0; --open-soft: rgba(91, 224, 160, .13); --soon: #FFC56B; --soon-soft: rgba(255, 197, 107, .13); --later: #B3BCD3; --later-soft: rgba(169, 179, 204, .12);
  --shadow: rgba(0, 0, 0, .5); --mark-bg: #1A2350; --band: var(--night);
  color-scheme: dark;
}
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--ink); }
html { scrollbar-color: color-mix(in srgb, var(--muted) 50%, transparent) var(--bg); caret-color: var(--accent); accent-color: var(--accent); }

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
h1, h2, h3, p, dl, dd, ul { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--f-mono); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.h2 { font-family: var(--f-body); font-weight: 800; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.08; letter-spacing: -.035em; text-wrap: balance; margin-top: 10px; }
.h2 em, .cat-head h1 em { font-family: var(--f-serif); font-style: italic; font-weight: 600; letter-spacing: -.01em; font-size: 1.12em; color: var(--accent); }
.sec-lead { color: var(--muted); font-size: 17px; max-width: 58ch; margin-top: 12px; }

/* ---------- Header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--hh);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); transition: background .25s ease, border-color .25s ease;
}
.top .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top-left { display: flex; align-items: center; gap: 28px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 11px; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -.02em; color: var(--ink); text-decoration: none; border: 0; background: none; cursor: pointer; padding: 0; }
.brand.small { font-size: 15px; gap: 9px; cursor: default; }
.brand .acc { color: var(--accent); }
.nav { display: flex; gap: 4px; }
.nav button { border: 0; background: transparent; cursor: pointer; padding: 8px 12px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.langs { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
.langs button { border: 0; background: transparent; cursor: pointer; padding: 6px 11px; border-radius: 999px; font-family: var(--f-mono); font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.top.glass { background: transparent; border-color: transparent; backdrop-filter: none; }
.top.glass.glass-solid { background: rgba(7, 11, 24, .8); border-color: rgba(255, 255, 255, .08); backdrop-filter: blur(14px); }
.top.glass .brand { color: var(--night-ink); }
.top.glass .brand .acc { color: var(--signal); }
.top.glass .nav button { color: var(--night-muted); }
.top.glass .nav button[aria-current="page"] { color: var(--night-ink); background: rgba(255, 255, 255, .08); }
.top.glass .langs { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .14); }
.top.glass .langs button { color: var(--night-muted); }
.top.glass .langs button[aria-pressed="true"] { background: var(--night-ink); color: var(--night); }
.brand .word { white-space: nowrap; }
@media (max-width: 640px) {
  .nav button[data-go="home"] { display: none; }
  .top-left { gap: 8px; }
  .brand { font-size: 15px; gap: 8px; }
  .brand .mark { width: 30px; height: 30px; }
  .nav button { padding: 7px 10px; font-size: 15px; }
  .langs button { padding: 10px 9px; font-size: 13px; }
}

.mark { flex: none; display: block; }
.mark .m-bg { fill: var(--mark-bg); }
.mark .m-ring { fill: none; stroke: var(--mark-ring); stroke-width: 1; }
.mark .m-stop { stop-color: var(--mark-accent); }
.mark .m-edge { stroke: var(--mark-accent); stroke-width: 1.7; stroke-linecap: round; }
.mark .m-glow { fill: var(--mark-accent); fill-opacity: .38; }
.mark .m-blip { fill: var(--mark-blip); }
.m-sweep { transform-box: view-box; transform-origin: 16px 16px; animation: msweep 1.6s cubic-bezier(.25, .7, .25, 1) 1 both; }
.m-target { animation: mblip 1.6s ease-out 1 both; }
.m-spin { transform-box: view-box; transform-origin: 16px 16px; animation: mspin 2.4s linear infinite; animation-play-state: paused; }
.brand:hover .m-spin { animation-play-state: running; }
@keyframes mspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes msweep { from { transform: rotate(-360deg); } to { transform: rotate(0deg); } }
@keyframes mblip { 0%, 78% { opacity: 0; } 100% { opacity: 1; } }

/* ---------- Hero (always dark) ---------- */
.hero {
  position: relative; margin-top: calc(-1 * var(--hh)); padding-top: var(--hh); overflow: hidden; color: var(--night-ink);
  background: var(--night);
}
/* background photo: a night colonnade. Layers: dim photo -> brighter copy revealed by a cursor spotlight -> dark overlay -> glow -> content.
   The whole stack moves with the mouse and slower than the page on scroll (--px, --py, --sy are set from JS). */
.hero-bg {
  position: absolute; inset: -7% -4% -7% -4%; pointer-events: none; z-index: 0;
  transform: translate3d(var(--px, 0px), calc(var(--py, 0px) + var(--sy, 0px)), 0) scale(1.05); will-change: transform;
}
.hero-photo, .hero-lit { position: absolute; inset: 0; background: var(--photo) 60% 100% / cover no-repeat; }
.hero-photo { opacity: .5; }
.hero-lit {
  opacity: 0; filter: brightness(1.3) saturate(1.15); transition: opacity .5s ease;
  -webkit-mask-image: radial-gradient(circle var(--lr, 300px) at var(--lx, 70%) var(--ly, 55%), #000 0%, rgba(0, 0, 0, .55) 38%, transparent 72%);
  mask-image: radial-gradient(circle var(--lr, 300px) at var(--lx, 70%) var(--ly, 55%), #000 0%, rgba(0, 0, 0, .55) 38%, transparent 72%);
}
.hero.lit-on .hero-lit { opacity: 1; }
.hero-glow {
  position: absolute; left: 0; top: 0; width: 640px; height: 640px; margin: -320px 0 0 -320px; border-radius: 50%; pointer-events: none; z-index: 1;
  background: radial-gradient(circle, rgba(143, 162, 255, .16) 0%, rgba(143, 162, 255, .05) 40%, transparent 68%);
  transform: translate3d(var(--gx, -999px), var(--gy, -999px), 0); opacity: 0; transition: opacity .5s ease; mix-blend-mode: screen;
}
.hero.lit-on .hero-glow { opacity: 1; }
.stage { transform: translate3d(calc(var(--px, 0px) * -0.6), calc(var(--py, 0px) * -0.6 + var(--sy2, 0px)), 0); }
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background:
    linear-gradient(90deg, rgba(7, 11, 24, .94) 0%, rgba(7, 11, 24, .72) 38%, rgba(7, 11, 24, .18) 70%, rgba(7, 11, 24, .35) 100%),
    linear-gradient(180deg, rgba(7, 11, 24, .85) 0%, rgba(7, 11, 24, .2) 38%, rgba(7, 11, 24, .1) 70%, rgba(7, 11, 24, .9) 100%);
}
.hero::after {
  content: ""; position: absolute; right: 4%; top: 12%; width: 46%; aspect-ratio: 1; border-radius: 50%; pointer-events: none; z-index: 1;
  background: radial-gradient(circle, rgba(88, 108, 255, .26) 0%, rgba(88, 108, 255, 0) 65%);
}
.hero .wrap { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 64px 104px; }
@media (max-width: 900px) {
  .hero .wrap { grid-template-columns: 1fr; padding-block: 28px 56px; }
  .hero-photo, .hero-lit { background-position: 28% 100%; }
  .hero::after { right: -10%; top: auto; bottom: 0; width: 100%; }
}
.pill-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); font-size: 15px; color: var(--night-muted); }
.pill-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(91, 224, 160, .18); }
.hero h1 { font-family: var(--f-body); font-weight: 800; font-size: clamp(36px, 4.9vw, 70px); line-height: .98; letter-spacing: -.045em; text-wrap: balance; margin-top: 22px; max-width: 15ch; }
.hero h1 em {
  font-family: var(--f-serif); font-style: italic; font-weight: 600; letter-spacing: -.01em; font-size: 1.14em; padding-right: .06em;
  background: linear-gradient(95deg, #FFD891, var(--amber) 45%, #FF9A6B); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero-lead { font-size: 20px; line-height: 1.55; color: var(--night-muted); max-width: 50ch; margin-top: 24px; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.btn-main {
  display: inline-flex; align-items: center; gap: 10px; border: 0; cursor: pointer; padding: 15px 24px; border-radius: 14px;
  background: var(--amber); color: #1A1305; font-size: 17px; font-weight: 700; box-shadow: 0 10px 30px rgba(255, 197, 107, .25);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn-main:hover { transform: translateY(-1px); box-shadow: 0 14px 34px rgba(255, 197, 107, .35); }
.btn-ghost { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 15px 22px; border-radius: 14px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .16); color: var(--night-ink); font-size: 17px; font-weight: 600; }
.btn-ghost:hover { background: rgba(255, 255, 255, .1); }
.hstats { display: flex; flex-wrap: wrap; gap: 0; margin-top: 40px; }
@property --ai-a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.ai-note {
  display: flex; align-items: center; gap: 14px; max-width: 590px; margin-top: 28px; padding: 12px 18px 12px 12px; border-radius: 18px;
  border: 1px solid transparent;
  background: linear-gradient(rgba(11, 16, 38, .82), rgba(11, 16, 38, .82)) padding-box,
              conic-gradient(from var(--ai-a), rgba(138, 155, 255, .9), rgba(91, 224, 160, .8), rgba(255, 197, 107, .8), rgba(138, 155, 255, .9)) border-box;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 12px 40px rgba(60, 80, 220, .18);
  animation: aispin 6s linear infinite;
}
@keyframes aispin { to { --ai-a: 360deg; } }
.ai-badge {
  position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 13px;
  background: linear-gradient(135deg, #1FB67F 0%, #2C9BD6 60%, #4F63FF 100%); box-shadow: 0 6px 18px rgba(40, 170, 160, .4), inset 0 1px 0 rgba(255, 255, 255, .3);
  font-family: var(--f-display); font-weight: 700; font-size: 15px; color: #fff; letter-spacing: .02em;
}
.ai-badge .ai-check { width: 24px; height: 24px; color: #fff; }
.ai-tag { position: absolute; right: -9px; bottom: -7px; padding: 2px 6px 2px; border-radius: 7px; font-family: var(--f-body); font-size: 11px; font-weight: 800; line-height: 1.2; letter-spacing: .04em; color: #fff; background: linear-gradient(135deg, #6A5CFF, #B05CFF); box-shadow: 0 0 0 2px rgba(11, 16, 38, .95), 0 4px 10px rgba(120, 90, 255, .5); }
.ai-badge .ai-spark { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; color: #FFE2A8; filter: drop-shadow(0 0 6px rgba(255, 197, 107, .7)); animation: aitwinkle 2.4s ease-in-out infinite; }
@keyframes aitwinkle { 50% { transform: scale(.7) rotate(20deg); opacity: .7; } }
.ai-txt { display: grid; gap: 2px; min-width: 0; }
.ai-txt b { font-weight: 700; font-size: 15px; line-height: 1.3; color: var(--night-ink); }
.ai-txt span { font-size: 15px; line-height: 1.4; color: var(--night-muted); }
@media (prefers-reduced-motion: reduce) { .ai-note, .ai-badge .ai-spark { animation: none; } }
.hstat { padding: 0 28px; border-left: 1px solid rgba(255, 255, 255, .14); }
.hstat:first-child { padding-left: 0; border-left: 0; }
.hstat b { display: block; font-family: var(--f-body); font-size: 30px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hstat span { font-size: 15px; color: var(--night-muted); }
@media (max-width: 350px) { .ctas { flex-wrap: wrap !important; } .hero h1 { font-size: 32px; } }
@media (max-width: 560px) {
  .hero-lead { font-size: 17px; margin-top: 18px; }
  .ctas { flex-wrap: nowrap; gap: 10px; margin-top: 24px; }
  .ctas .btn-main, .ctas .btn-ghost { padding: 14px 15px; font-size: 15px; white-space: nowrap; }
  .ai-note { margin-top: 22px; }
  .ai-txt span { font-size: 13px; }
  .hstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 36px; }
  .hstat { padding: 0 12px; }
  .hstat span { font-size: 13px; line-height: 1.3; display: block; }
}
.hstat.live b { color: var(--mint); }
button.hstat { border-width: 0 0 0 1px; border-style: solid; border-color: rgba(255, 255, 255, .14); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
button.hstat span { text-decoration: underline dotted rgba(169, 179, 204, .6); text-underline-offset: 4px; }
button.hstat:hover span { color: var(--night-ink); }

.stage { position: relative; width: 100%; max-width: 580px; aspect-ratio: 1; justify-self: center; }
#globe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
#globe:active { cursor: grabbing; }
.float-cap { position: absolute; left: -2%; top: 0; width: 34%; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .45)); animation: floaty 6s ease-in-out infinite; pointer-events: none; }
.gcard {
  position: absolute; display: grid; gap: 6px; padding: 13px 15px; border-radius: 16px; min-width: 200px; max-width: 240px;
  background: rgba(14, 20, 48, .5); border: 1px solid rgba(255, 255, 255, .12); backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 20px 40px rgba(0, 0, 0, .35); color: var(--night-ink); cursor: pointer; text-align: left;
  animation: floaty 7s ease-in-out infinite;
}
.gcard.ga { right: -3%; bottom: 8%; animation-delay: -2s; }
.gcard.gb { right: 2%; top: 4%; animation-delay: -4.5s; }
.gc-top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--night-muted); }
.gc-name { font-weight: 700; font-size: 17px; line-height: 1.25; }
.gc-st { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 13px; color: var(--night-muted); }
.gc-st i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.gc-st i.open { background: var(--mint); box-shadow: 0 0 10px var(--mint); }
.gc-st i.soon { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
.gc-st i.later { background: #9AA6C8; }
.drag-hint { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); font-family: var(--f-mono); font-size: 13px; letter-spacing: .08em; color: var(--night-muted); white-space: nowrap; opacity: .8; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@media (max-width: 900px) { .stage { max-width: 440px; } .gcard { min-width: 0; max-width: 200px; padding: 11px 13px; } .gc-name { font-size: 15px; } .gcard.gb { top: 0; right: 0; } .gcard.ga { right: 0; bottom: 4%; } }
@media (max-width: 420px) { .gcard.gb { display: none; } }

/* ---------- Deadline board: a departures board of the nearest openings and closings (always a dark screen) ---------- */
.board-sec .wrap { padding-block: 72px 8px; }
html[data-world="night"] .board-sec .wrap { padding-top: 24px; }
.board {
  --bcols: minmax(0, 2.3fr) minmax(0, 1.2fr) minmax(0, 1fr) 150px;
  position: relative; overflow: hidden; border-radius: 28px; color: var(--night-ink); padding: clamp(20px, 3vw, 36px);
  background: radial-gradient(70% 90% at 88% 0%, rgba(88, 108, 255, .2) 0%, rgba(88, 108, 255, 0) 70%), linear-gradient(170deg, #0C1330 0%, #070B18 100%);
  border: 1px solid rgba(143, 162, 255, .16); box-shadow: 0 34px 60px -34px rgba(7, 11, 24, .55);
}
.board-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 40px; }
.board-head .h2 { margin-top: 0; color: var(--night-ink); }
.board-head .h2 em { color: var(--amber); }
.board-lead { color: var(--night-muted); font-size: 17px; max-width: 52ch; margin-top: 12px; }
.board-all {
  display: inline-flex; align-items: center; gap: 8px; flex: none; cursor: pointer; padding: 12px 18px; border-radius: 12px; font-size: 15px; font-weight: 600;
  background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .16); color: var(--night-ink); transition: background .2s ease, border-color .2s ease;
}
.board-all:hover { background: rgba(255, 255, 255, .1); border-color: rgba(255, 197, 107, .5); }
.board-cols {
  display: grid; grid-template-columns: var(--bcols); gap: 16px; margin-top: 30px; padding: 0 14px 10px;
  font-family: var(--f-mono); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--night-muted);
  border-bottom: 1px solid rgba(255, 255, 255, .1);
}
.board-cols span:last-child { text-align: right; }
.board-rows { list-style: none; margin: 0; padding: 0; }
.brow {
  width: 100%; display: grid; grid-template-columns: var(--bcols); gap: 16px; align-items: center; padding: 14px; text-align: left; cursor: pointer;
  border: 0; border-bottom: 1px dashed rgba(255, 255, 255, .09); border-radius: 0; background: transparent; color: inherit;
  transition: background .2s ease;
}
.board-rows li:last-child .brow { border-bottom: 0; }
.brow:hover, .brow:focus-visible { background: rgba(143, 162, 255, .08); border-radius: 14px; }
.brow.s-open { --st: var(--mint); } .brow.s-soon { --st: var(--amber); } .brow.s-later { --st: #9AA6C8; }
.b-prog { display: flex; align-items: center; gap: 14px; min-width: 0; }
.b-prog .flag { width: 38px; height: 26px; border-radius: 4px; }
.b-txt { display: grid; min-width: 0; }
.b-name { font-weight: 700; font-size: 17px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-cc { font-size: 13px; color: var(--night-muted); }
.b-ev { display: flex; align-items: center; gap: 9px; font-size: 15px; color: var(--night-muted); }
.b-ev i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--st); box-shadow: 0 0 10px var(--st); }
.b-date { font-family: var(--f-mono); font-size: 15px; font-weight: 700; color: var(--night-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.b-left { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.bfl {
  position: relative; display: grid; place-items: center; width: 27px; height: 38px; border-radius: 6px;
  font-family: var(--f-body); font-weight: 700; font-size: 21px; color: var(--st); font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #212D69 0%, #1A2353 49.6%, #0F1636 50.4%, #0C1230 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 4px 10px rgba(0, 0, 0, .35); text-shadow: 0 0 12px color-mix(in srgb, var(--st) 45%, transparent);
}
.bfl::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(3, 6, 18, .75); }
.bfl.tilde { width: 18px; background: none; box-shadow: none; color: var(--night-muted); text-shadow: none; }
.bfl.tilde::after { display: none; }
.b-unit { margin-left: 6px; min-width: 3.6em; font-family: var(--f-mono); font-size: 13px; color: var(--night-muted); }
.board-empty { padding: 28px 14px 8px; color: var(--night-muted); }
@media (max-width: 900px) {
  .board-cols { display: none; }
  .board-rows { margin-top: 18px; }
  .brow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "p l" "e l"; row-gap: 6px; column-gap: 12px; padding: 14px 4px; }
  .brow:hover, .brow:focus-visible { border-radius: 12px; }
  .b-prog { grid-area: p; gap: 12px; } .b-prog .flag { width: 32px; height: 22px; }
  .b-ev { grid-area: e; padding-left: 44px; font-size: 13px; flex-wrap: wrap; gap: 4px 8px; }
  .b-ev .b-date { font-size: 13px; color: var(--night-ink); }
  .b-left { grid-area: l; flex-direction: column; align-items: flex-end; gap: 4px; }
  .b-left .cells { display: flex; gap: 3px; }
  .bfl { width: 24px; height: 34px; font-size: 19px; }
  .b-unit { margin: 0; min-width: 0; }
}
.b-left .cells { display: flex; gap: 4px; }
.b-ev .b-date { display: none; }
@media (max-width: 900px) { .b-ev .b-date { display: inline; } .brow > .b-date { display: none; } }

/* ---------- Steps: a flight route from search to take-off ---------- */
.steps-sec .wrap, .dest .wrap { padding-block: 88px 24px; }
.route { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px; margin: 48px 0 0; padding: 0; list-style: none; }
.route::before { content: ""; position: absolute; left: 28px; right: 12%; top: 27px; border-top: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent); }
.rstep { position: relative; display: grid; gap: 14px; align-content: start; }
.rhead { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.rnode {
  position: relative; z-index: 1; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-family: var(--f-mono); font-size: 15px; font-weight: 700; color: var(--accent);
  background: var(--bg); border: 1.5px solid var(--accent); box-shadow: 0 0 0 8px var(--bg);
}
.rstep:last-child .rnode { background: var(--amber); border-color: var(--amber); color: #1A1305; box-shadow: 0 0 0 8px var(--bg), 0 0 28px rgba(255, 197, 107, .45); }
.rart { width: 150px; height: 104px; flex: none; color: var(--accent); background: var(--bg); padding: 0 10px; box-sizing: content-box; position: relative; z-index: 1; }
.rart .hot { color: var(--amber); }
.rart * { vector-effect: non-scaling-stroke; }
.rstep h3 { font-size: 24px; font-weight: 700; letter-spacing: -.015em; margin-top: 6px; }
.rstep p { color: var(--muted); font-size: 17px; max-width: 34ch; }
@media (max-width: 860px) {
  .route { grid-template-columns: 1fr; gap: 34px; margin-top: 36px; }
  .route::before { left: 27px; right: auto; top: 28px; bottom: 40px; border-top: 0; border-left: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent); }
  .rstep { grid-template-columns: 56px minmax(0, 1fr); column-gap: 18px; row-gap: 6px; }
  .rhead { display: contents; }
  .rnode { grid-row: 1 / 3; align-self: start; }
  .rart { display: none; }
  .rstep h3 { margin-top: 12px; font-size: 20px; }
}

/* ---------- Destinations: an atlas grouped by region, each country with its next date ---------- */
.atlas { columns: 3 260px; column-gap: 48px; margin-top: 40px; }
.areg { break-inside: avoid; margin-bottom: 36px; }
.areg h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
.areg h3 b { font-family: var(--f-mono); font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.arow {
  width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 2px; text-align: left; cursor: pointer;
  border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink);
}
.arow .flag { width: 32px; height: 22px; border-radius: 3px; transition: transform .2s ease; }
.a-name { font-weight: 600; font-size: 17px; line-height: 1.3; transition: color .15s ease; }
.a-date { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.a-date i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--later); }
.arow.s-open .a-date i { background: var(--open); box-shadow: 0 0 0 3px var(--open-soft); }
.arow.s-soon .a-date i { background: var(--soon); box-shadow: 0 0 0 3px var(--soon-soft); }
.arow.s-rolling .a-date i { background: var(--accent); }
.arow:hover .a-name, .arow:focus-visible .a-name { color: var(--accent); }
.arow:hover .flag { transform: translateX(3px); }

/* ---------- Finale: the radar is on, pick a direction ---------- */
.finale .wrap { padding-block: 72px 16px; }
.finale-box {
  position: relative; overflow: hidden; isolation: isolate; border-radius: 32px; text-align: center;
  padding: clamp(44px, 7vw, 96px) clamp(20px, 5vw, 64px); display: grid; justify-items: center; gap: 18px;
  background: var(--surface); border: 1px solid var(--line);
}
.finale-scope { position: absolute; left: 50%; top: 50%; width: max(760px, 120%); aspect-ratio: 1; transform: translate(-50%, -50%); z-index: -1; pointer-events: none; color: var(--accent); opacity: .5; }
.finale-scope circle, .finale-scope path { fill: none; stroke: currentColor; stroke-opacity: .35; }
.finale-sweep {
  position: absolute; left: 50%; top: 50%; width: max(760px, 120%); aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; z-index: -1; pointer-events: none;
  background: conic-gradient(from 0deg, transparent 0deg 300deg, color-mix(in srgb, var(--accent) 16%, transparent) 355deg, transparent 360deg);
  animation: fsweep 9s linear infinite;
}
@keyframes fsweep { to { rotate: 360deg; } }
@media (prefers-reduced-motion: reduce) { .finale-sweep { animation: none; } }
.finale h2 { font-family: var(--f-body); font-weight: 800; font-size: clamp(32px, 4.6vw, 60px); line-height: 1.02; letter-spacing: -.04em; text-wrap: balance; max-width: 16ch; }
.finale h2 em { font-family: var(--f-serif); font-style: italic; font-weight: 600; letter-spacing: -.01em; font-size: 1.12em; color: var(--accent); }
.finale-lead { font-size: clamp(17px, 1.6vw, 20px); color: var(--muted); max-width: 46ch; text-wrap: balance; }
.finale-next {
  display: inline-flex; align-items: center; gap: 10px; max-width: 100%; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer;
  font-family: var(--f-mono); font-size: 13px; font-weight: 700; color: var(--ink); text-align: left; font-variant-numeric: tabular-nums;
}
.finale-next i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--open); box-shadow: 0 0 0 4px var(--open-soft); }
.finale-next:hover { border-color: var(--accent); }
.finale .btn-main { margin-top: 10px; }

/* ---------- Partner + footer ---------- */
.partner .wrap { padding-block: 40px 56px; }
.partner-box { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: center; padding: 28px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line); }
.partner h2 { font-family: var(--f-body); font-weight: 700; font-size: 24px; letter-spacing: -.025em; text-wrap: balance; }
.partner p { color: var(--muted); font-size: 17px; margin-top: 8px; max-width: 60ch; }
.contact { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 14px; padding: 16px 18px; }
.contact small { display: block; font-family: var(--f-mono); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.contact strong { display: block; font-family: var(--f-mono); font-size: 17px; margin-top: 4px; }
@media (max-width: 760px) { .partner-box { grid-template-columns: 1fr; } }
/* partner offer is not live yet: blurred teaser with a "Coming soon" tag */
.partner-box.soon { position: relative; overflow: hidden; }
.partner-box.soon > :not(.soon-tag) { filter: blur(7px); opacity: .7; pointer-events: none; user-select: none; }
.partner-box.soon::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--accent) 16%, transparent) 50%, transparent 70%) -100% 0 / 60% 100% no-repeat;
  animation: soonsweep 4.5s ease-in-out infinite;
}
@keyframes soonsweep { 0% { background-position: -100% 0; } 60%, 100% { background-position: 260% 0; } }
.soon-tag { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; }
.soon-pill {
  display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px 11px 16px; border-radius: 999px;
  font-family: var(--f-mono); font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
  background: color-mix(in srgb, var(--surface) 78%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 7%, transparent), 0 10px 40px color-mix(in srgb, var(--accent) 22%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.soon-dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.soon-dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--accent); animation: syncping 2.2s ease-out infinite; }
.soon-pill .dots { margin-left: -.55em; letter-spacing: .04em; }
.soon-pill .dots i { font-style: normal; animation: soondot 1.4s infinite; opacity: .15; }
.soon-pill .dots i:nth-child(2) { animation-delay: .2s; } .soon-pill .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes soondot { 0%, 20% { opacity: .15; } 40%, 70% { opacity: 1; } 100% { opacity: .15; } }
@media (prefers-reduced-motion: reduce) { .partner-box.soon::after, .soon-dot::after { animation: none; } .soon-pill .dots i { animation: none; opacity: 1; } }
footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 24px 36px; color: var(--muted); font-size: 15px; display: grid; gap: 8px; }
.foot-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.powered {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px 6px 9px; border: 1px solid var(--line); border-radius: 999px;
  font-family: var(--f-mono); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
}
.powered svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.powered b { font-family: var(--f-display); font-size: 15px; font-weight: 700; letter-spacing: .01em; text-transform: none; color: var(--ink); }
.powered b i { font-style: normal; color: var(--accent); }

/* ---------- Catalogue head ---------- */
.cat-head .wrap { padding-block: 36px 8px; }
.crumb { border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.crumb:hover { color: var(--accent); }
.jump { display: none; }
@media (max-width: 560px) { .jump { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; } }
.list { scroll-margin-top: calc(var(--hh) + env(safe-area-inset-top, 0px)); }
.cat-head h1 { font-family: var(--f-body); font-weight: 800; font-size: clamp(34px, 4.8vw, 58px); line-height: 1.02; letter-spacing: -.04em; margin-top: 14px; text-wrap: balance; }

/* ---------- Polar radar (always dark screen) ---------- */
.radar-sec .wrap { padding-block: 22px 8px; }
.screen {
  position: relative; overflow: hidden; border-radius: 28px; color: var(--night-ink); padding: clamp(18px, 3vw, 32px);
  background: radial-gradient(60% 80% at 30% 50%, rgba(88, 108, 255, .22) 0%, rgba(88, 108, 255, 0) 70%), linear-gradient(160deg, #070B18 0%, #0E1534 100%);
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(18px, 3vw, 40px); align-items: center;
}
@media (max-width: 900px) { .screen { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .screen { padding: 14px 12px 18px; border-radius: 22px; } .pb { box-shadow: 0 0 0 2px rgba(7, 11, 24, .85), 0 0 9px color-mix(in srgb, var(--st) 50%, transparent); } }
.pscope { position: relative; width: 100%; max-width: 520px; aspect-ratio: 1; justify-self: center; }
.pgrid { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.psweep {
  position: absolute; left: 9.402%; top: 9.402%; width: 81.197%; height: 81.197%; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 0deg, rgba(143, 162, 255, 0) 0deg, rgba(143, 162, 255, 0) 270deg, rgba(143, 162, 255, .1) 320deg, rgba(143, 162, 255, .42) 359.5deg, rgba(143, 162, 255, 0) 360deg);
}
.psweep::after { content: ""; position: absolute; left: 50%; top: 0; width: 2px; height: 50%; margin-left: -1px; background: linear-gradient(rgba(201, 210, 255, .95), rgba(143, 162, 255, .1)); }
.pb {
  position: absolute; transform: translate(-50%, -50%); width: var(--dot, 24px); height: var(--dot, 24px); min-height: 0; padding: 0; border-radius: 50%; cursor: pointer; font-size: 0; line-height: 0;
  border: 2px solid var(--st); background: #0B1230; box-shadow: 0 0 0 3px rgba(7, 11, 24, .85), 0 0 16px color-mix(in srgb, var(--st) 55%, transparent);
  transition: transform .2s ease;
}
.pb:hover, .pb:focus-visible { transform: translate(-50%, -50%) scale(1.25); z-index: 3; }
.pb .pf { position: absolute; inset: 0; display: block; border-radius: 50%; overflow: hidden; }
.pb .pf .flag { display: block; width: 100%; height: 100%; outline: none; border-radius: 0; }
.pb.s-open { --st: var(--mint); }
.pb.s-soon { --st: var(--amber); }
.pb.s-later { --st: #9AA6C8; }
.pb { transition: transform .2s ease, opacity .3s ease; }
.pb.off { opacity: 0; transform: translate(-50%, -50%) scale(.3); pointer-events: none; }
.pb.found { animation: pbfound .6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pbfound { from { transform: translate(-50%, -50%) scale(.3); } to { transform: translate(-50%, -50%) scale(1); } }
.pgrid, .psweep { transition: opacity .6s ease, filter .6s ease; }
.pscope.is-off .pgrid { opacity: .4; filter: saturate(.5); }
.pscope.is-off .psweep { opacity: 0; }
.pstart {
  position: absolute; left: 50%; top: 50%; z-index: 4; width: var(--pst, 34%); height: var(--pst, auto); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; align-content: center; gap: 8px; padding: 10px; text-align: center;
  border: 1px solid rgba(255, 197, 107, .55); color: #FFE2A8; font-weight: 700; font-size: clamp(12px, 1.3vw, 15px); line-height: 1.2;
  background: radial-gradient(circle at 50% 40%, #22327A 0%, #0B1230 78%);
  box-shadow: 0 0 0 8px rgba(255, 197, 107, .07), 0 0 46px rgba(255, 197, 107, .28);
  transition: transform .35s ease, opacity .35s ease, box-shadow .25s ease;
}
.pstart::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 1.5px solid rgba(255, 197, 107, .55); animation: pring 2s ease-out infinite; pointer-events: none; }
.pstart svg { width: 28%; height: auto; }
.pstart:hover { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 0 0 10px rgba(255, 197, 107, .1), 0 0 60px rgba(255, 197, 107, .4); }
.pstart.gone { opacity: 0; transform: translate(-50%, -50%) scale(.55); pointer-events: none; }
@keyframes pring { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
/* data-freshness console: split-flap date, weekly freshness cells */
.sync {
  --hud: rgba(255, 197, 107, .75);
  position: relative; margin-bottom: 26px; padding: 16px 18px 15px; border-radius: 18px; overflow: hidden; container-type: inline-size;
  border: 1px solid rgba(255, 255, 255, .09);
  background:
    radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.4px) 0 0 / 14px 14px,
    linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .015));
}
.sync::before {
  content: ""; position: absolute; inset: 7px; pointer-events: none;
  background:
    linear-gradient(var(--hud), var(--hud)) left top / 14px 1.5px, linear-gradient(var(--hud), var(--hud)) left top / 1.5px 14px,
    linear-gradient(var(--hud), var(--hud)) right top / 14px 1.5px, linear-gradient(var(--hud), var(--hud)) right top / 1.5px 14px,
    linear-gradient(var(--hud), var(--hud)) left bottom / 14px 1.5px, linear-gradient(var(--hud), var(--hud)) left bottom / 1.5px 14px,
    linear-gradient(var(--hud), var(--hud)) right bottom / 14px 1.5px, linear-gradient(var(--hud), var(--hud)) right bottom / 1.5px 14px;
  background-repeat: no-repeat;
}
.sync-top { display: flex; align-items: center; gap: 9px; white-space: nowrap; font-family: var(--f-mono); font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--night-muted); }
.sync-dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 10px var(--mint); flex: none; }
.sync-dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--mint); animation: syncping 2.2s ease-out infinite; }
@keyframes syncping { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.9); opacity: 0; } }
.sync-ago { margin-left: auto; color: var(--mint); letter-spacing: .04em; text-transform: none; font-weight: 600; white-space: nowrap; }
.sync.stale .sync-dot { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
.sync.stale .sync-dot::after { display: none; }
.sync.stale .sync-ago { color: var(--amber); }
.flap { display: flex; align-items: center; gap: 4px; gap: min(5px, 1.1cqi); margin-top: 14px; perspective: 400px; }
.fl {
  position: relative; display: grid; place-items: center; width: 30px; width: min(44px, 9.4cqi); aspect-ratio: .72; border-radius: 7px;
  font-family: var(--f-body); font-weight: 700; font-size: 21px; font-size: min(30px, 6.4cqi); color: #FFE2A8; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #212D69 0%, #1A2353 49.6%, #0F1636 50.4%, #0C1230 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), inset 0 -1px 0 rgba(0, 0, 0, .4), 0 6px 14px rgba(0, 0, 0, .35);
  text-shadow: 0 0 14px rgba(255, 197, 107, .35);
}
.fl::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; margin-top: -.5px; background: rgba(3, 6, 18, .75); }
.fl.flip { animation: flp .08s linear; }
@keyframes flp { 50% { transform: rotateX(70deg); filter: brightness(.6); } }
.fsep { width: 6px; height: 6px; margin: 0 2px; margin: 0 min(5px, 1cqi); align-self: flex-end; margin-bottom: 8px; border-radius: 50%; background: var(--night-muted); opacity: .55; }
/* countdown to the next weekly check: bar shrinks, red (7 days left) -> yellow -> green (check is close) */
.cd { --cd: #5BE0A0; margin-top: 16px; }
.cd-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.cd-lbl { font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--night-muted); }
.cd-time { font-family: var(--f-mono); font-size: 15px; font-weight: 700; color: var(--cd); font-variant-numeric: tabular-nums; letter-spacing: .02em; text-shadow: 0 0 12px color-mix(in srgb, var(--cd) 45%, transparent); white-space: nowrap; }
.cd-bar { position: relative; height: 7px; margin-top: 9px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.cd-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--f, 100%); border-radius: 4px; background: var(--cd); box-shadow: 0 0 12px color-mix(in srgb, var(--cd) 60%, transparent); transition: width 1s linear, background .6s ease; }
.cd-bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 7 - 2px), rgba(10, 14, 32, .95) calc(100% / 7 - 2px) calc(100% / 7)); pointer-events: none; }
.sync-meta { margin-top: 13px; padding-top: 10px; border-top: 1px dashed rgba(255, 255, 255, .1); font-family: var(--f-mono); font-size: 12px; color: rgba(169, 179, 204, .8); }

    if (el.hasAttribute("data-sort")) { SORT = el.getAttribute("data-sort"); store("gr-sort", SORT); renderFilters(); renderGrid(); return; }
    if (el.hasAttribute("data-radar-on")) { radarTurnOn(); return; }
    if (el.hasAttribute("data-rescan")) { radarRescan(); return; }
    if (el.hasAttribute("data-ftoggle")) { fOpen = !fOpen; var fb = document.getElementById("filters"); fb.classList.toggle("open", fOpen); el.setAttribute("aria-expanded", String(fOpen)); return; }
    if (el.hasAttribute("data-lang")) { lang = el.getAttribute("data-lang"); store("gr-lang", lang); renderAll(); return; }
    if (el.hasAttribute("data-go")) { show(el.getAttribute("data-go")); return; }
    if (el.hasAttribute("data-scroll")) { var tg = document.getElementById(el.getAttribute("data-scroll")); if (tg) tg.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth" }); return; }
    if (el.hasAttribute("data-country")) { F = blankF(); F.cc = el.getAttribute("data-country"); renderFilters(); renderGrid(); show("grants"); return; }
    if (el.hasAttribute("data-clearcc")) { F.cc = ""; renderFilters(); renderGrid(); return; }
    if (el.hasAttribute("data-close")) { closeDetail(); return; }
    if (el.hasAttribute("data-open")) { openDetail(el.getAttribute("data-open")); return; }
    if (el.hasAttribute("data-fav")) {
      var id = el.getAttribute("data-fav");
      if (favs.has(id)) favs.delete(id); else favs.add(id);
      store("gr-fav", Array.from(favs));
      if (F.fav) renderGrid(); else el.setAttribute("aria-pressed", String(favs.has(id)));
      return;
    }
    if (el.hasAttribute("data-reset")) { F = blankF(); renderFilters(); renderGrid(); return; }
    var g = el.getAttribute("data-f"), v = el.getAttribute("data-v");
    if (g === "lv" || g === "st" || g === "rg") F[g] = v; else F[g] = !F[g];
    renderFilters(); renderGrid();
  });
  document.addEventListener("input", function (e) {
    if (e.target.id !== "q") return;
    var had = anyFilter(); F.q = e.target.value.trim();
    if (had !== anyFilter()) renderFilters();
    renderGrid();
  });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) closeDetail(); });

  renderAll();
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  show(location.hash === "#grants" ? "grants" : "home", { fromHistory: true });
  runIntro();
  if (location.protocol.indexOf("http") === 0 && window.fetch) {
    fetch("grants.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!validData(d)) return;
      G = d.grants; CHECKED = d.checked;
      renderAll();
    }).catch(function () {});
  }
})();
</script>
